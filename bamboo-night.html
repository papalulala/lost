<section id="snake-story" aria-label="竹林裡的發現" hidden><p>那天沒有月光。

我站了一會兒，才看清竹子上盤著一尾赤尾青竹絲。牠正在休息，身上彷彿有一點青光。

我就站在原地看了很久。牠也一直沒動。</p><button id="snake-close" type="button">收起</button></section>

  const group=new T.Group();group.position.set(site.x,digLevel,site.z);scene.add(group);
  const pit=part(group,new T.SphereGeometry(1,20,12),innerDirt,0,-.02,0);pit.scale.set(.67,.16,.54);
  const rim=part(group,new T.TorusGeometry(.61,.081,9,24),dirt,0,-.105,0);rim.rotation.x=Math.PI/2;rim.scale.y=.79;
  const cap=part(group,new T.IcosahedronGeometry(1,2),dirt,0,-.14,0);cap.scale.set(.61,.24,.49);
  const cue=part(group,new T.OctahedronGeometry(.077),glintMat,0,-.39,0);
  const pickup=new T.Group();pickup.position.y=-.20;group.add(pickup);pickup.visible=false;
  if(i===0){
   part(pickup,new T.SphereGeometry(.143,24,18),new T.MeshPhysicalMaterial({color:0x498aa9,roughness:.17,metalness:.18,clearcoat:1}));
   const curl=part(pickup,new T.TorusGeometry(.104,.018,10,27,Math.PI*1.46),material(0xc9e5d7),0,-.102,0);curl.rotation.x=Math.PI/2;curl.rotation.z=.24;
  }else{
   const mat=material(i===1?0xa37a40:0x8e5e49,.54);
   part(pickup,new T.CylinderGeometry(.164,.164,.035,32),mat);
   const border=part(pickup,new T.TorusGeometry(.132,.012,8,25),material(i===1?0xb79658:0xb37e65),0,-.025,0);border.rotation.x=Math.PI/2;
   if(i===2)for(const x of [-.039,.039])for(const z of [-.039,.039])part(pickup,new T.CylinderGeometry(.018,.018,.008,10),innerDirt,x,-.021,z);
   else part(pickup,new T.BoxGeometry(.025,.012,.095),material(0xc49c5d),0,-.026,0);
  }
  const target=part(group,new T.SphereGeometry(.57,14,9),new T.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}),0,-.19,0);
  target.scale.set(1,.58,.86);target.userData.dig=i;digTargets.push(target);
  const findLight=new T.PointLight(0xe5c994,0,1.12,2);
  findLight.position.set(.17,-.46,.13);group.add(findLight);
  Object.assign(site,{group,cap,cue,pickup,findLight,step:0});
 }
 function digAt(e){
  if(camera.position.y>-1.98)return false;
  const bounds=r.domElement.getBoundingClientRect();
  digPointer.set((e.clientX-bounds.left)/bounds.width*2-1,1-(e.clientY-bounds.top)/bounds.height*2);
  digRay.setFromCamera(digPointer,camera);
  const [hit]=digRay.intersectObjects(digTargets,false);if(!hit)return false;
  const [cover]=digRay.intersectObjects(scenery,false);
  if(cover&&cover.distance+.04<hit.distance)return false;
  const i=hit.object.userData.dig,site=digSites[i];
  if(site.step<4){
   site.step++;
   const left=1-site.step*.18;
   site.cap.scale.set(.61*left,.24*left,.49*left);
   site.cap.position.y=-.14+site.step*.020;
   burst={position:site.group.position.clone(),start:lastFrame}; digFlash.position.copy(site.group.position).add(new T.Vector3(.06,-.54,.08));digFlash.intensity=3.6;
   if(site.step===4){site.cap.visible=false;site.pickup.visible=true;}
   digHintUntil=lastFrame+2.4; hint.textContent=site.step===4?'露出一件失物 · 再點一下讀故事':'挖開了 '+site.step+' / 4 層';
  }else{
   showLost(keepsakes.length+i,site.title,site.text);
  }
  return true;
 }
 function updateDig(t){
  for(const site of digSites){
   site.cue.rotation.y=t*.9;site.cue.position.y=-.43+Math.sin(t*2+site.x)*.043;
   site.cue.visible=site.step<4;
   if(site.pickup.visible){site.pickup.rotation.y=.31*Math.sin(t*1.4+site.z);site.findLight.intensity=.23+.025*Math.sin(t*1.6+site.x);}
  }
  if(burst){
   const age=t-burst.start; digFlash.intensity=3.6*Math.exp(-age*12.5);
   debris.forEach((o,i)=>{
    o.visible=age<.57;
    const a=i*2.399;
    o.position.copy(burst.position).add(new T.Vector3(Math.cos(a)*age*.71,-.23-.75*age+.81*age*age,Math.sin(a)*age*.71));
   });
   if(age>=.57){burst=null;digFlash.intensity=0;}
  }
 }
 function showLost(id,title,words){
  found.add(id);
  document.getElementById('lost-count').textContent='失物 '+found.size+' / '+(keepsakes.length+digSites.length);
  document.getElementById('lost-title').textContent=title;
  document.getElementById('lost-words').textContent=words;
  snakeStory.hidden=true;controls.enabled=false;lostDialog.showModal();
 }
 let digHintUntil=0;
 function readKeepsake(event){
  const rect=r.domElement.getBoundingClientRect();
  lostPointer.set((event.clientX-rect.left)/rect.width*2-1,1-(event.clientY-rect.top)/rect.height*2);
  lostRay.setFromCamera(lostPointer,camera);
  const [hit]=lostRay.intersectObjects(pickables,false);
  if(!hit)return false;
  const [cover]=lostRay.intersectObjects(scenery,false);
  if(cover&&cover.distance+.045<hit.distance)return false;
  const i=hit.object.userData.item,item=keepsakes[i];showLost(i,item.title,item.text);return true;
 }
 lostDialog.addEventListener('close',()=>controls.enabled=true);
 function resize(){
  camera.aspect=innerWidth/innerHeight;
  camera.fov=Math.min(78,Math.max(42,2*Math.atan(Math.tan(42*Math.PI/360)/camera.aspect)*180/Math.PI));
  camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);
 }
 addEventListener('resize',resize);resize();
 r.shadowMap.needsUpdate=true;
 hint.textContent='拖曳繞看山徑 · 點暖色標記讀故事';
 r.setAnimationLoop(ms=>{
  const t=ms*.001;
  mists.forEach((o,i)=>{const a=i*2.399;o.position.set(Math.sin(a)*5.9+Math.sin(t*.14+a)*.54,-.19+.13*Math.sin(t*.25+i),Math.cos(a)*4.7+Math.cos(t*.11+a)*.31);});
  lamp.intensity=12+.61*Math.sin(t*2.4)+.29*Math.sin(t*5.1);
  updateSnake(t);updateDig(t);r.render(scene,camera);
 });
}catch(e){hint.textContent='竹林載入失敗，請確認連線後重新整理。';console.error(e);}
