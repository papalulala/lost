<script type="module">
import * as T from 'three';
import {RoundedBoxGeometry} from 'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/geometries/RoundedBoxGeometry.js';

const scene=new T.Scene();
const camera=new T.PerspectiveCamera(40,1,.1,90);
const renderer=new T.WebGLRenderer({alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const ambient=new T.HemisphereLight(0xc9b6bf,0x41465b,1.14);
const sun=new T.DirectionalLight(0xffb365,3.45);
sun.position.set(10,4.4,-5.7);
sun.castShadow=true;
sun.shadow.mapSize.set(1536,1536);
Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:.3,far:29});
sun.shadow.bias=-.00045;
sun.shadow.normalBias=.015;
const skyFill=new T.DirectionalLight(0xa8bce2,.52);
skyFill.position.set(-5,5,7);
scene.add(ambient,sun,skyFill);

const status=document.querySelector('#status');
const letterForm=document.querySelector('#letter-form'),launch=document.querySelector('#launch');
let seed=74026;
function random(){
 seed=(Math.imul(seed,1664525)+1013904223)>>>0;
 return seed/4294967296;
}
const size=11;
const grid=Array.from({length:size},()=>Array(size).fill(true));
const steps=[[0,-1],[1,0],[0,1],[-1,0]];
const stack=[[1,1]];
grid[1][1]=false;
while(stack.length){
 const [x,z]=stack.at(-1);
 const choices=steps.map(([dx,dz])=>[x+dx*2,z+dz*2]).filter(([a,b])=>a>0&&b>0&&a<size-1&&b<size-1&&grid[b][a]);
 if(!choices.length){stack.pop();continue;}
 const [a,b]=choices[Math.floor(random()*choices.length)];
 grid[(z+b)/2][(x+a)/2]=grid[b][a]=false;
 stack.push([a,b]);
}
const cell=.78;
const mazePosition=(x,z,y=0)=>new T.Vector3((x-5)*cell,y,(z-5)*cell);
const blockShape=new RoundedBoxGeometry(1,1,1,2,.06);
const stoneTile=document.createElement('canvas');
stoneTile.width=stoneTile.height=128;
const stoneInk=stoneTile.getContext('2d');
const pixels=stoneInk.createImageData(128,128);
for(let y=0;y<128;y++)for(let x=0;x<128;x++){
 const grit=(Math.imul(x+17,83492791)^Math.imul(y+7,19349663))>>>25;
 const grain=22*Math.sin(x*.13+y*.095)+14*Math.cos(x*.23-y*.31);
 const veins=14*Math.sin(x*.058+y*.14+2*Math.cos(x*.08-y*.035));
  const coarse=(Math.imul((x>>2)+19,2654435761)^Math.imul((y>>2)+27,1597334677))>>>26;
 const pits=grit>111?-24:0;
 const value=193+grit*.37+coarse*.37+grain*.65+veins*.69+pits;
 const i=(y*128+x)*4;
 pixels.data.set([value,value,value,255],i);
}
stoneInk.putImageData(pixels,0,0);
const rockBump=.088;
const stoneRelief=new T.CanvasTexture(stoneTile);
const stoneColor=stoneRelief.clone();
stoneColor.colorSpace=T.SRGBColorSpace;
stoneColor.needsUpdate=true;
const rockShapes=Array.from({length:9},(_,variant)=>{
 const shape=new RoundedBoxGeometry(1,1,1,2,.23);
 const position=shape.attributes.position;
 const phase=variant*1.91;
 for(let i=0;i<position.count;i++){
  const x=position.getX(i),y=position.getY(i),z=position.getZ(i);
  const wave=Math.sin(x*5.6+y*4.4+z*6+phase);
  const chip=Math.cos(z*8.2-x*5.1+y*4.7+phase*1.3);
  const taper=1-.25*Math.max(0,y+.11);
  const crown=T.MathUtils.smoothstep(y,.18,.48);
  const fracture=x*.73+z*.39+.13*Math.sin(phase);
  const brokenPlane=fracture>0?-.115*fracture:.065*fracture;
  const split=-.055*Math.exp(-Math.abs(fracture+.065*Math.sin(z*7+phase))*21);
  const ridge=crown*(brokenPlane+split+.034*Math.cos(z*10+phase));
  position.setXYZ(i,x*taper+.073*wave+.085*y,y+.057*chip+.033*wave+ridge,z*taper+.057*chip-.06*y);
 }
 shape.computeVertexNormals();
 shape.morphAttributes.position=[blockShape.attributes.position];
 shape.morphAttributes.normal=[blockShape.attributes.normal];
 return shape;
});
const blocks=[];
function rockSurface(material,index,isWall){
 const hasMoss=index%7<3&&(isWall||index%3===0);
 const angle=index*2.39996;
 const onCrown=index%4!==1;
 const center=new T.Vector3(
  Math.cos(angle)*(onCrown?.19:.43),
  onCrown?.48:-.09+.24*Math.sin(index),
  Math.sin(angle)*(onCrown?.19:.43)
 );
 const fade={value:1};
 const tableSurface={
  texture:{value:stoneColor},tint:{value:new T.Color(0xffffff)},
  uv:{value:new T.Vector4(1,1,0,0)},wood:{value:0}
 };
 material.userData.tableSurface=tableSurface;
 material.onBeforeCompile=shader=>{
  shader.uniforms.mossCenter={value:center};
  shader.uniforms.stoneFade=fade;
  shader.uniforms.tableTexture=tableSurface.texture;
  shader.uniforms.tableTint=tableSurface.tint;
  shader.uniforms.tableUvTransform=tableSurface.uv;
  shader.uniforms.tableWood=tableSurface.wood;
  shader.uniforms.mossAmount={value:hasMoss?1:0};
  shader.uniforms.leftStone={value:new T.Color(0x788a9a)};
  shader.uniforms.rightStone={value:new T.Color(0x9b968d)};
  shader.uniforms.mossShade={value:new T.Color(0x326B5D)};
  shader.uniforms.mossMid={value:new T.Color(0x5BA45C)};
  shader.uniforms.mossLight={value:new T.Color(0x75B95A)};
  shader.vertexShader='varying vec3 mossPoint; varying float stoneX; varying vec2 joineryUv;\n'+shader.vertexShader.replace(
   '#include <begin_vertex>','#include <begin_vertex>\nmossPoint=position; stoneX=(modelMatrix*vec4(transformed,1.)).x; joineryUv=uv;');
  shader.fragmentShader=`uniform vec3 mossCenter;
uniform float stoneFade,mossAmount,tableWood;
uniform sampler2D tableTexture;
uniform vec3 tableTint;
uniform vec4 tableUvTransform;
varying vec2 joineryUv;
uniform vec3 leftStone,rightStone,mossShade,mossMid,mossLight;
varying float stoneX;
varying vec3 mossPoint;
`+shader.fragmentShader.replace('#include <color_fragment>',`#include <color_fragment>
 vec3 delta=mossPoint-mossCenter;
 float waviness=.066*sin(mossPoint.x*27.+sin(mossPoint.z*22.))+.049*cos(mossPoint.z*31.+mossPoint.y*17.);
 float edge=length(delta*vec3(.92,1.02,1.)) + waviness;
 float cover=(1.-smoothstep(.31,.50,edge))*mossAmount;
 vec3 cell=floor(mossPoint*170.);
 float speck=fract(sin(dot(cell,vec3(19.63,67.21,113.87)))*43758.54);
 float mottling=.5+.5*sin(mossPoint.x*47.+mossPoint.z*28.)*cos(mossPoint.y*43.-mossPoint.z*27.);
 float mossBlend=smoothstep(-4.1,4.1,stoneX+.52*delta.x+.32*delta.y);
 vec3 mossColor=mix(mossShade,mossMid,smoothstep(0.,.66,mossBlend));
 mossColor=mix(mossColor,mossLight,smoothstep(.40,1.,mossBlend)*.80);
 mossColor*=.91+.11*mottling+.045*speck;
 float across=smoothstep(-4.15,4.15,stoneX);
 vec3 tone=mix(leftStone,rightStone,across);
 float rockDetail=.90+.09*speck+.045*sin(mossPoint.x*32.+mossPoint.z*14.+mossPoint.y*9.);
 vec3 stone=mix(diffuseColor.rgb*tone*rockDetail,mossColor,cover*.94);
 vec2 woodUv=joineryUv*tableUvTransform.xy+tableUvTransform.zw;
 vec3 tableColor=tableTint*mix(vec3(1.),texture2D(tableTexture,woodUv).rgb,tableWood);
 diffuseColor.rgb=mix(tableColor,stone,stoneFade);`);
 };
 return fade;
}
function block(position,scale,color,isWall){
 const material=new T.MeshStandardMaterial({color:color.clone().lerp(new T.Color(0xffffff),.965),roughness:.98});
 material.map=stoneColor;
 material.bumpMap=stoneRelief;
 material.bumpScale=rockBump;
 const surfaceFade=rockSurface(material,blocks.length,isWall);
 const mesh=new T.Mesh(rockShapes[blocks.length%rockShapes.length],material);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 mesh.position.copy(position);
 mesh.scale.set(...scale);
 if(isWall)mesh.rotation.set((random()-.5)*.10,(random()-.5)*.50,(random()-.5)*.14);
 scene.add(mesh);
 blocks.push({
  mesh,mazeGeometry:mesh.geometry,surfaceFade,position:position.clone(),scale:mesh.scale.clone(),orientation:mesh.quaternion.clone(),color:material.color.clone(),
  scatter:new T.Vector3((random()-.5)*14,1.7+random()*5.6,(random()-.5)*12),
  spin:new T.Vector3(random()*7,random()*7,random()*7),delay:random()*.24
 });
}
for(let z=0;z<size;z++){
 for(let x=0;x<size;x++){
  if(grid[z][x]){
   const h=.68+random()*.91;
   const color=new T.Color().setHSL(.59+random()*.035,.13+random()*.12,.45+random()*.14);
   const embed=.32;
   const position=mazePosition(x,z,h/2-.035-embed/2);
   position.x+=(random()-.5)*.14;
   position.z+=(random()-.5)*.14;
   block(position,[cell*(.94+random()*.26),h+embed,cell*(.91+random()*.29)],color,true);
  }
 }
}
const floorSpan=size*cell/5;
for(let z=0;z<5;z++){
 for(let x=0;x<5;x++){
  const edgeX=x===0?-1:x===4?1:0;
  const edgeZ=z===0?-1:z===4?1:0;
  const rim=edgeX!==0||edgeZ!==0;
  const inset=.38+random()*.10;
  const jitter=.08;
  const px=(x-2)*floorSpan-edgeX*inset+(random()-.5)*jitter;
  const pz=(z-2)*floorSpan-edgeZ*inset+(random()-.5)*jitter;
  const thickness=rim?.46+random()*.38:.29+random()*.16;
  const width=floorSpan*(edgeX!==0?1.10+random()*.06:1.34+random()*.14);
  const depth=floorSpan*(edgeZ!==0?1.10+random()*.06:1.34+random()*.14);
  const color=new T.Color().setHSL(.59+random()*.037,.13+random()*.10,.45+random()*.12);
  const surface=-.044+(random()-.5)*.044;
  block(new T.Vector3(px,surface-thickness*.5,pz),[width,thickness,depth],color,false);
 }
}
const ruins=new T.Group();
scene.add(ruins);
const creeper=new T.MeshStandardMaterial({color:0x326B5D,roughness:1});
const leaves=[0x5BA45C,0x75B95A,0x4C987B].map(color=>new T.MeshStandardMaterial({color,roughness:.94}));
const foliage=new T.SphereGeometry(1,8,5);
const ivyMaterial=new T.MeshStandardMaterial({color:0x4C987B,roughness:.92,side:T.DoubleSide});
const ivyOutline=new T.Shape();
ivyOutline.moveTo(0,-.031);
ivyOutline.lineTo(-.023,-.010);
ivyOutline.lineTo(-.041,.012);
ivyOutline.lineTo(-.016,.009);
ivyOutline.lineTo(0,.040);
ivyOutline.lineTo(.016,.009);
ivyOutline.lineTo(.041,.012);
ivyOutline.lineTo(.023,-.010);
ivyOutline.closePath();
const ivyLeaf=new T.ShapeGeometry(ivyOutline);
const mossTones=[0x4C987B,0x5BA45C,0x326B5D].map(color=>new T.MeshStandardMaterial({color,roughness:1}));
const darkStone=new T.MeshStandardMaterial({color:0x303847,roughness:.99});
const metalTorch=new T.MeshStandardMaterial({color:0x574338,roughness:.7,metalness:.55});
const creatureGreens=[0x395a3a,0x597746,0x72854b,0x344d38].map(color=>new T.MeshStandardMaterial({color,roughness:.74}));
const eyeWhite=new T.MeshStandardMaterial({color:0xe7ce83,emissive:0x322510,roughness:.55});
const pupil=new T.MeshStandardMaterial({color:0x151514,roughness:.44});
const creatures=[],torches=[];
function oval(parent,material,x,y,z,sx,sy,sz){
 const mesh=new T.Mesh(foliage,material);
 mesh.position.set(x,y,z);
 mesh.scale.set(sx,sy,sz);
 parent.add(mesh);
 return mesh;
}
function wallLine(parent,points,radius,material){
 const path=new T.CatmullRomCurve3(points.map(p=>new T.Vector3(...p)));
 parent.add(new T.Mesh(new T.TubeGeometry(path,14,radius,5,false),material));
}
const wallFaces=[];
const crownRay=new T.Raycaster(new T.Vector3(),new T.Vector3(0,-1,0));
let wallIndex=0;
for(let z=0;z<size;z++)for(let x=0;x<size;x++){
 if(!grid[z][x])continue;
 const wall=blocks[wallIndex++];
 const h=wall.position.y+wall.scale.y*.5;
 const open=steps.filter(([dx,dz])=>grid[z+dz]?.[x+dx]===false);
 if(!open.length)continue;
 // Favor wall faces seen from the overhead entrance view.
 const [dx,dz]=open.find(([,dz])=>dz===1)||open[0];
 const face=new T.Group();
 face.position.set(wall.position.x,0,wall.position.z);
 face.position.x+=dx*wall.scale.x*.48;
 face.position.z+=dz*wall.scale.z*.48;
 face.rotation.y=Math.atan2(dx,dz);
 ruins.add(face);
 const wallFace={face,h,wallMesh:wall.mesh,plants:[]};
 wallFaces.push(wallFace);
 const plantCover=.49+.33*Math.sin(x*.72+z*.58)+.12*Math.cos(x*1.7-z*.87);
 const strandCount=plantCover>.65?5:plantCover>.37?3:plantCover>.16?2:1;
 for(let strand=0;strand<strandCount;strand++){
  const start=-.31+strand*.62/Math.max(1,strandCount-1)+(random()-.5)*.09;
  const climb=strand%3===2;
  const length=.31+random()*(.39+plantCover*.66);
  const points=Array.from({length:9},(_,i)=>{
   const t=i/8;
   return [start+.075*Math.sin(t*5.7+wallIndex)+t*.085*Math.sin(strand),
    climb?.06+t*length:h+.067-t*length,.023+.051*Math.sin(t*Math.PI)*(.5+random()*.5)];
  });
  wallLine(face,points,.008+random()*.004,creeper);
  points.forEach(([lx,ly,lz],i)=>{
   const side=i%2?1:-1;
   const width=.019+random()*.021;
   const leaf=oval(face,leaves[(i+strand)%3],lx+side*.024,ly-.016,lz+.012,width,.016+random()*.014,.006);
   leaf.rotation.set(.2+random()*.55,side*.4,-side*(.53+random()*.44));

function makeWoodTexture(){

 for(let y=0;y<tile.height;y++)for(let x=0;x<tile.width;x++){
  const u=x/(tile.width-1),v=y/(tile.height-1);
  const bend=4.3*Math.sin(v*4.8+u*5.2)+2.2*Math.sin(v*12.1+u*15);
  const fiber=x+bend;
  const narrow=Math.pow(.5+.5*Math.sin(fiber*.95+1.4*Math.cos(fiber*.16)),6);
  const wide=Math.sin(fiber*.18+Math.sin(v*4.4)*.6);

  const knotDistance=Math.hypot(knotX,knotY);
  const knot=Math.exp(-knotDistance/16)*(.5+.5*Math.sin(knotDistance*1.22));
  const noise=((Math.imul(x+37,83492791)^Math.imul(y+13,19349663))>>>25)/127;
  const shade=wide*2.4-narrow*6.6-knot*13+(noise-.5)*3.7;
  const index=(y*tile.width+x)*4;
  image.data.set([248-u*12+shade,224-u*14+shade,190-u*13+shade,255],index);
 }
 ink.putImageData(image,0,0);

 texture.colorSpace=T.SRGBColorSpace;
 return texture;
}

function canRollAt(x,z){
 const gx=x/cell+5,gz=z/cell+5,r=fireRadius/cell;
 for(let row=Math.round(gz-r);row<=Math.round(gz+r);row++){
  for(let col=Math.round(gx-r);col<=Math.round(gx+r);col++){
   if(grid[row]?.[col]===false)continue;
   const dx=Math.max(0,Math.abs(gx-col)-.5),dz=Math.max(0,Math.abs(gz-row)-.5);

function updateCritters(dt,time){
 for(const c of critters){
  if(!c.alive)continue;
  const near=Math.hypot(fireball.position.x-c.position.x,fireball.position.z-c.position.z);
  if(near<fireRadius+.13){
   c.alive=false;
   c.model.visible=false;
   if(c.index===2)dropMemoryCard(c.position);
   continue;
  }
  const atCell=c.position.distanceToSquared(c.target)<.0001;
  if(near<.58){
   c.alarm=.68;
   if(atCell){
    let best=near+.025,next=null;
    for(const [dx,dz] of steps){
     const x=c.x+dx,z=c.z+dz;
     if(grid[z]?.[x]!==false||critters.some(other=>other!==c&&other.x===x&&other.z===z))continue;
     const position=mazePosition(x,z);
     const distance=Math.hypot(fireball.position.x-position.x,fireball.position.z-position.z);
     if(distance>best){best=distance;next={x,z,position};}
    }
    if(next){
     c.x=next.x;c.z=next.z;
     c.model.rotation.y=Math.atan2(next.position.x-c.position.x,next.position.z-c.position.z);
     c.target.copy(next.position);
    }
   }
  }else{
   c.alarm=Math.max(0,c.alarm-dt);
  }
  if(!atCell){
   const distance=c.position.distanceTo(c.target);
   c.position.lerp(c.target,Math.min(1,dt*1.22/Math.max(.001,distance)));
  }
  critterRayOrigin.set(c.position.x,3,c.position.z);
  critterGroundRay.set(critterRayOrigin,downward);
  const floor=critterGroundRay.intersectObjects(floorMeshes)[0]?.point.y??0;
  const hop=c.alarm>0?.135*Math.abs(Math.sin(time*13+c.index)):.012*Math.sin(time*2.8+c.index);
  c.model.position.set(c.position.x,floor+hop,c.position.z);
  c.body.scale.y=.125*(1+.11*Math.sin(time*(c.alarm>0?21:3)+c.index));
 }
}

 if(b.bin===undefined)return;
 const center=binLeft+binWidth*(b.bin+.5);
 const wallGap=binWidth*.5-ballRadius-.044;
 b.x=T.MathUtils.clamp(b.x,center-wallGap,center+wallGap);
 let support=-2.66;
 for(const settled of settledMarbles){
  if(settled.bin!==b.bin)continue;
  const dx=b.x-settled.mesh.position.x;
  const diameter=2*ballRadius;
  if(Math.abs(dx)>=diameter)continue;
  const collisionY=settled.mesh.position.y+Math.sqrt(diameter*diameter-dx*dx);
  if(b.y>=settled.mesh.position.y-.045)support=Math.max(support,collisionY);
 }
 if(b.y>support)return;
 b.y=support;
 b.vy=Math.min(1.85,Math.max(0,-b.vy*.34));
 b.vx*=.48;
 if(Math.abs(b.vy)<.15)scoreMarble(b);
}
const launchGuideLength=guide.getLength();
const launchGuideEnd=guide.getPointAt(1);
const launchGuideTangent=guide.getTangentAt(1);
const guideDeceleration=4.75;
function guideStep(marble,dt){
 const speed=marble.guideVelocity;
 marble.guideDistance+=(speed-.5*guideDeceleration*dt)*dt;
 marble.guideVelocity-=guideDeceleration*dt;
 if(marble.guideDistance>=launchGuideLength){
  const exitSpeed=Math.max(.32,marble.guideVelocity*.53);
  marble.inGuide=false;
  marble.x=launchGuideEnd.x;
  marble.y=launchGuideEnd.y;
  marble.vx=launchGuideTangent.x*exitSpeed;
  marble.vy=launchGuideTangent.y*exitSpeed;
  marble.lowest=marble.y;
  marble.mesh.position.copy(launchGuideEnd);
  return true;
 }
 if(marble.guideDistance<=0&&marble.guideVelocity<0)return false;
 marble.mesh.position.copy(guide.getPointAt(Math.max(0,marble.guideDistance/launchGuideLength)));
 return true;
}
function returnToReserve(marble){
 const returned=reserveMarbles[marblesRemaining++];
 returned.material=marble.mesh.material;
 returned.position.set(2.16,-3.045-(2.16+.17)*.122,.23);
 returned.visible=true;
 board.remove(marble.mesh);
}
function updateBall(dt){
 updateReserve(dt);
 for(let i=activeMarbles.length-1;i>=0;i--){
  const marble=activeMarbles[i];
  if(marble.inGuide){
   if(!guideStep(marble,dt)){
    returnToReserve(marble);
    activeMarbles.splice(i,1);
   }
   continue;
  }
  marble.step+=dt;
  while(!marble.settled&&!storyPaused()&&marble.step>=1/120){
   marble.step-=1/120;
   marbleStep(marble,1/120);
  }
  if(marble.settled)activeMarbles.splice(i,1);
  else marble.mesh.position.set(marble.x,marble.y,.13);
  if(storyPaused())return;
 }
}
const playCanvas=renderer.domElement;
playCanvas.addEventListener('click',readPegStory);
const mapRay=new T.Raycaster();
const mapPointer=new T.Vector2();
playCanvas.addEventListener('click',event=>{
 if(phase!=='final-map'||rotateFinalMap.wasGesture||pegStory.open)return;
 const bounds=playCanvas.getBoundingClientRect();
 mapPointer.set((event.clientX-bounds.left)/bounds.width*2-1,1-(event.clientY-bounds.top)/bounds.height*2);
 mapRay.setFromCamera(mapPointer,camera);
 if(!mapRay.intersectObjects([paper,backPaper]).length)return;
 countKeepsake('手繪的遊戲地圖');
 pegTitle.textContent='手繪的遊戲地圖';
 pegText.textContent='那時沒有攻略，我們就拿方格紙畫。你拿鉛筆，我按方向鍵。走錯的地方擦了又畫，紙薄得快要破掉。\n\n最後那一格，你寫了「下次再走」。後來地圖弄丟了，遊戲也早就打完。只有那四個字，我一直記得。';
 pegStory.querySelector('button').textContent='闔上故事';
 pegStory.showModal();
});
const memoryPicker=new T.Raycaster();
const memoryPointer=new T.Vector2();
playCanvas.addEventListener('click',event=>{
 if(phase!=='maze'||rotateMaze.wasGesture||!memoryCard.visible||memoryDrop.age<.72||pegStory.open)return;
 const bounds=playCanvas.getBoundingClientRect();
 memoryPointer.set((event.clientX-bounds.left)/bounds.width*2-1,1-(event.clientY-bounds.top)/bounds.height*2);
 memoryPicker.setFromCamera(memoryPointer,camera);
 const cardHit=memoryPicker.intersectObject(memoryCard,true)[0];
 if(!cardHit)return;
 const wallHit=memoryPicker.intersectObjects(wallMeshes)[0];
 if(wallHit&&wallHit.distance<cardHit.distance)return;
 countKeepsake('遊戲記憶卡');
 pegTitle.textContent='遊戲記憶卡';
 pegText.textContent='放學後，我們輪流玩同一台主機。要吃飯時，你總說再等一下，存完檔就好。\n\n後來那張記憶卡不見了。再打開遊戲，畫面只剩「開始新遊戲」。我看著那行字，想不起我們上次是在哪裡存的檔。';
 pegStory.querySelector('button').textContent='回到迷宮';
 pegStory.showModal();
});
const knobScreen=new T.Vector3();
function hitPlunger(event){
 const bounds=playCanvas.getBoundingClientRect();
 plungerKnob.getWorldPosition(knobScreen).project(camera);
 const x=bounds.left+(knobScreen.x+1)*bounds.width/2;
 const y=bounds.top+(1-knobScreen.y)*bounds.height/2;
 return Math.hypot(event.clientX-x,event.clientY-y)<(event.pointerType==='touch'?49:37);
}
playCanvas.addEventListener('pointerdown',event=>{
 if(phase!=='table'||storyPaused()||!event.isPrimary||event.button!==0)return;
 if(tableWonAt===null&&marblesRemaining>0&&hitPlunger(event)){
  plungerDrag={id:event.pointerId,y:event.clientY};
 }else{
  tableDrag={id:event.pointerId,x:event.clientX,tilt:tableTilt};
 }
 playCanvas.setPointerCapture(event.pointerId);
});
playCanvas.addEventListener('pointermove',event=>{
 if(event.pointerId===plungerDrag?.id){
  plungerPull=T.MathUtils.clamp((event.clientY-plungerDrag.y)/88,0,1);
  return;
 }
 if(event.pointerId!==tableDrag?.id)return;
 requestedTilt=T.MathUtils.clamp(tableDrag.tilt+(event.clientX-tableDrag.x)*.00145,-.105,.105);
});
function releaseTable(event){
 if(event.pointerId===plungerDrag?.id){
  const pull=plungerPull;
  plungerDrag=null;
  if(event.type==='pointerup'&&pull>.10)shoot(pull);
  return;
 }
 if(event.pointerId!==tableDrag?.id)return;
 tableDrag=null;
 requestedTilt=0;
}
for(const type of ['pointerup','pointercancel','lostpointercapture'])playCanvas.addEventListener(type,releaseTable);
function updatePlunger(dt){
 if(!plungerDrag)plungerPull=T.MathUtils.damp(plungerPull,0,24,dt);
 plungerKnob.position.y=handleRest-.29*plungerPull;
 launcherRod.position.y=launcherY-.11-.23*plungerPull;
 launcherSpring.scale.y=1-.47*plungerPull;
 launcherSpring.position.y=launcherY*(1-launcherSpring.scale.y)-.13*plungerPull;
 linkStart.set(launcherX,launcherRod.position.y-.47,launcherZ);
 linkEnd.copy(plungerKnob.position);
 linkDirection.subVectors(linkEnd,linkStart);
 plungerLink.position.copy(linkStart).lerp(linkEnd,.5);
 plungerLink.scale.y=linkDirection.length();
 plungerLink.quaternion.setFromUnitVectors(plungerUp,linkDirection.normalize());
}
function updateTableTilt(dt){
 tableTilt=T.MathUtils.damp(tableTilt,requestedTilt,tableDrag?11:6.5,dt);
 board.quaternion.copy(boardQuaternion).multiply(tableRoll.setFromAxisAngle(tableRollAxis,tableTilt));
}
const controlArea=document.querySelector('footer');
const fitCorner=new T.Vector3();
const inverseTableView=tableView.clone().invert();
function fitTable(){
 const tangent=Math.tan(T.MathUtils.degToRad(camera.fov/2));
 let distance=tableCamera.length();
 for(const x of [-3.55,3.55])for(const y of [-4.35,4.35])for(const z of [-.34,.65]){
  fitCorner.set(x,y,z).applyQuaternion(boardQuaternion).applyQuaternion(inverseTableView);
  const vertical=Math.abs(fitCorner.y)/(tangent*.91);
  const horizontal=Math.abs(fitCorner.x)/(tangent*camera.aspect*.92);
  distance=Math.max(distance,fitCorner.z+Math.max(vertical,horizontal));
 }
 camera.position.copy(cameraOffset).applyQuaternion(tableView).multiplyScalar(distance).add(look);
 camera.quaternion.copy(tableView);
}
function resize(){
 const width=Math.max(1,innerWidth);
 const height=Math.max(1,phase==='table'?Math.floor(controlArea.getBoundingClientRect().top-12):innerHeight);
 renderer.setSize(width,height);
 camera.aspect=width/height;
 camera.fov=camera.aspect<.8?72:42;
 camera.updateProjectionMatrix();
 if(phase==='table')fitTable();
}
addEventListener('resize',resize);
reset();
rebuild(3);
renderer.setAnimationLoop(ms=>{
 now=ms;
 const dt=Math.min(.045,(ms-(previous||ms))/1000);
 previous=ms;
 if(phase==='maze'){
  if(pegStory.open){renderer.render(scene,camera);return;}
  updateFireball(dt,ms*.001);
  animateRuins(ms*.001,dt);
  updateCritters(dt,ms*.001);
  updateMemoryCard(dt);
  updateHiddenP(dt,ms*.001);
 }else if(phase==='reveal-map'){revealFinalMap((ms-phaseStart)/1000);}
 else if(phase==='to-maze'){
  const remaining=2.91-(ms-phaseStart)/1000;
  if(remaining<=0)reset();
  else rebuild(remaining);
 }else if(phase==='table'){
  if(!storyPaused()){
   updateTableTilt(dt);
   updatePlunger(dt);
   updateBall(dt);
  }
  updateStoryPins(dt);
  if(tableWonAt===null&&marblesRemaining===0&&activeMarbles.length===0&&!storyPaused()&&storyPins.every(item=>item.found)){
   tableWonAt=ms;
   launch.disabled=true;
  }
  if(tableWonAt!==null&&ms-tableWonAt>1100&&!storyPaused())openMaze();
 }
 renderer.render(scene,camera);
});
</script>
