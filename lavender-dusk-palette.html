<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>失物宇宙｜淡藍紫暮光色票</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6ebd8;color:#38344a;font-family:system-ui,sans-serif}main{max-width:960px;margin:auto;padding:35px 22px 55px}h1{margin:.15em 0;font-size:clamp(30px,6vw,54px)}p{line-height:1.65}.band{height:100px;border-radius:9px;background:linear-gradient(90deg,#CBD5F6,#DDE0F2,#F6EBD8,#F7D9AC,#F3C082);border:1px solid #a9add7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(106px,1fr));gap:8px}button{background:#fffaf0;color:inherit;border:1px solid #a9add7;border-radius:7px;overflow:hidden;text-align:left;cursor:pointer;padding:0;font:inherit}.chip{height:59px;display:block;background:var(--swatch)}.label,code{display:block;margin:5px 8px;font-size:13px}#status{min-height:1.5em}a{color:#326b5d}
</style><main><small>失物宇宙 · 色票 02</small><h1>淡藍紫暮光</h1><p>保留第一套色票的配置：大面積冷色維持高明度，透過奶油色薄霧過渡到淺橘黃，把較鮮明的暖色集中在地平線。綠色植物與草地沿用第一套。點色塊可複製 sRGB HEX。</p><div class="band" role="img" aria-label="淡藍紫經奶油白過渡到淺橘黃"></div><section><h2>暮光漸層</h2><div class="grid"><button type="button" data-hex="#CBD5F6" aria-label="複製 淡藍紫天光 #CBD5F6"><span class="chip" style="--swatch:#CBD5F6"></span><span class="label">淡藍紫天光</span><code>#CBD5F6</code></button><button type="button" data-hex="#DDE0F2" aria-label="複製 薄霧藍紫 #DDE0F2"><span class="chip" style="--swatch:#DDE0F2"></span><span class="label">薄霧藍紫</span><code>#DDE0F2</code></button><button type="button" data-hex="#F6EBD8" aria-label="複製 奶油霧 #F6EBD8"><span class="chip" style="--swatch:#F6EBD8"></span><span class="label">奶油霧</span><code>#F6EBD8</code></button><button type="button" data-hex="#F7D9AC" aria-label="複製 淺橘黃 #F7D9AC"><span class="chip" style="--swatch:#F7D9AC"></span><span class="label">淺橘黃</span><code>#F7D9AC</code></button><button type="button" data-hex="#F3C082" aria-label="複製 蜜杏地平線 #F3C082"><span class="chip" style="--swatch:#F3C082"></span><span class="label">蜜杏地平線</span><code>#F3C082</code></button><button type="button" data-hex="#C8BDD8" aria-label="複製 地平線下的灰紫 #C8BDD8"><span class="chip" style="--swatch:#C8BDD8"></span><span class="label">地平線下的灰紫</span><code>#C8BDD8</code></button><button type="button" data-hex="#A9ADD7" aria-label="複製 遠景藍紫 #A9ADD7"><span class="chip" style="--swatch:#A9ADD7"></span><span class="label">遠景藍紫</span><code>#A9ADD7</code></button></div></section><section><h2>光影</h2><div class="grid"><button type="button" data-hex="#FFCC91" aria-label="複製 暖斜光 #FFCC91"><span class="chip" style="--swatch:#FFCC91"></span><span class="label">暖斜光</span><code>#FFCC91</code></button><button type="button" data-hex="#FFF0D8" aria-label="複製 環境上方暖光 #FFF0D8"><span class="chip" style="--swatch:#FFF0D8"></span><span class="label">環境上方暖光</span><code>#FFF0D8</code></button><button type="button" data-hex="#CBD3F6" aria-label="複製 背面淡藍紫補光 #CBD3F6"><span class="chip" style="--swatch:#CBD3F6"></span><span class="label">背面淡藍紫補光</span><code>#CBD3F6</code></button><button type="button" data-hex="#AAAEDB" aria-label="複製 環境下方紫灰 #AAAEDB"><span class="chip" style="--swatch:#AAAEDB"></span><span class="label">環境下方紫灰</span><code>#AAAEDB</code></button><button type="button" data-hex="#FFF0CD" aria-label="複製 暖光暈 #FFF0CD"><span class="chip" style="--swatch:#FFF0CD"></span><span class="label">暖光暈</span><code>#FFF0CD</code></button></div></section><section><h2>草地與植物 · 沿用第一套</h2><div class="grid"><button type="button" data-hex="#75B95A" aria-label="複製 草地亮綠 #75B95A"><span class="chip" style="--swatch:#75B95A"></span><span class="label">草地亮綠</span><code>#75B95A</code></button><button type="button" data-hex="#5BA45C" aria-label="複製 草地中綠 #5BA45C"><span class="chip" style="--swatch:#5BA45C"></span><span class="label">草地中綠</span><code>#5BA45C</code></button><button type="button" data-hex="#849D55" aria-label="複製 苔蘚橄欖 #849D55"><span class="chip" style="--swatch:#849D55"></span><span class="label">苔蘚橄欖</span><code>#849D55</code></button><button type="button" data-hex="#4C987B" aria-label="複製 樹冠藍綠 #4C987B"><span class="chip" style="--swatch:#4C987B"></span><span class="label">樹冠藍綠</span><code>#4C987B</code></button><button type="button" data-hex="#326B5D" aria-label="複製 葉下深青 #326B5D"><span class="chip" style="--swatch:#326B5D"></span><span class="label">葉下深青</span><code>#326B5D</code></button><button type="button" data-hex="#E3BC67" aria-label="複製 花穗金黃 #E3BC67"><span class="chip" style="--swatch:#E3BC67"></span><span class="label">花穗金黃</span><code>#E3BC67</code></button></div></section><p id="status" role="status"></p><p><a href="susurrus-palette.html">第一套 Susurrus 色票</a> · <a href="abandoned-playground.html">查看廢棄遊樂場</a></p></main><script>
document.querySelector('main').addEventListener('click',async e=>{
 const button=e.target.closest('[data-hex]');if(!button)return;
 const status=document.getElementById('status');
 try{await navigator.clipboard.writeText(button.dataset.hex);status.textContent='已複製 '+button.dataset.hex;}
 catch{const range=document.createRange();range.selectNodeContents(button.querySelector('code'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);status.textContent='已選取色碼，按 Ctrl+C 複製';}
});
</script></html>
