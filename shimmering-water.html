<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>失物宇宙｜波光粼粼的水面</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#254d50;color:#f7f1df;font-family:Georgia,"Noto Serif TC",serif}
canvas{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
header,footer{position:fixed;z-index:1;pointer-events:none;text-shadow:0 2px 9px #122b33}header{top:0;left:0;padding:24px 5vw}h1{margin:.18em 0;font-weight:500;font-size:clamp(26px,5.3vw,55px)}small{letter-spacing:.23em}
footer{width:100%;bottom:0;text-align:center;padding:16px 48px calc(16px + env(safe-area-inset-bottom));font-size:14px}
nav a{position:fixed;z-index:2;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:46px;height:48px;background:#fcf3dfdd;color:#594534;border:1px solid #836d55;border-radius:8px}
nav a:first-child{left:8px}nav a:last-child{right:8px}nav a:hover,nav a:focus-visible{outline:2px solid #ffe3a8;outline-offset:3px}
nav a::after{content:"";border-block:8px solid transparent;border-left:12px solid currentColor}nav a:first-child::after{transform:rotate(180deg)}
@media(pointer:coarse){nav a{top:auto;bottom:calc(53px + env(safe-area-inset-bottom));transform:none}header{padding:calc(12px + env(safe-area-inset-top)) 14px}footer{font-size:12px}}
</style>
<header><small>失物宇宙</small><h1>波光粼粼的水面</h1></header><footer id="hint" role="status">正在載入水面…</footer>
<nav aria-label="場景切換"><a href="blackout-stairwell.html" aria-label="上一個場景，停在七樓的電梯" title="停在七樓的電梯"></a><a href="stationery-tidepool.html" aria-label="下一個場景，放學後的舊文具店" title="放學後的舊文具店"></a></nav>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js"}}</script>
<script type="module">
const hint=document.getElementById('hint');
try{
 const T=await import('three');
 const {OrbitControls}=await import('https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/controls/OrbitControls.js');
 const scene=new T.Scene();
 const camera=new T.PerspectiveCamera(46,innerWidth/innerHeight,.08,240);
 camera.position.set(10,5.2,15);
 const renderer=new T.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));
 renderer.setSize(innerWidth,innerHeight);
 renderer.toneMapping=T.ACESFilmicToneMapping;
 document.body.prepend(renderer.domElement);
 const controls=new OrbitControls(camera,renderer.domElement);
 controls.target.set(0,.42,0);controls.enablePan=false;controls.enableDamping=false;
 controls.rotateSpeed=.66;controls.minDistance=5;controls.maxDistance=29;
 controls.minPolarAngle=.58;controls.maxPolarAngle=1.52;controls.update();
 const sunDirection=new T.Vector3(-.48,.20,-.85).normalize();
 const time={value:0};
 const sky=new T.Mesh(new T.SphereGeometry(135,30,20),new T.ShaderMaterial({
  side:T.BackSide,depthWrite:false,uniforms:{sun:{value:sunDirection}},
  vertexShader:`varying vec3 dir;void main(){dir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 dir;uniform vec3 sun;
   void main(){vec3 d=normalize(dir);float h=smoothstep(-.06,.55,d.y);
   vec3 c=mix(vec3(.83,.47,.27),vec3(.27,.55,.56),h);
   float a=max(0.,dot(d,sun));c+=vec3(.42,.21,.09)*pow(a,18.);
   c+=vec3(1.7,1.15,.53)*smoothstep(.9992,.99973,a);
   gl_FragColor=vec4(c,1.); #include <tonemapping_fragment>
   #include <colorspace_fragment>
   }`.replace(' #include','\n#include')
 }));
 sky.renderOrder=-2;scene.add(sky);
 const pulses=Array.from({length:6},()=>new T.Vector4(0,0,-100,0));
 const waves=new T.ShaderMaterial({
  uniforms:{time,sun:{value:sunDirection},pulses:{value:pulses}},
  vertexShader:`varying vec3 world;uniform float time;
   void main(){vec3 p=position;p.y+=.035*sin(p.x*1.8+p.z*.7+time*1.35)+.028*sin(p.z*2.2-p.x*.9-time*1.6);
   world=(modelMatrix*vec4(p,1.)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(world,1.);}`,
  fragmentShader:`
   varying vec3 world;uniform float time;uniform vec3 sun;uniform vec4 pulses[6];
   float wave(vec2 p){
    float h=.042*sin(dot(p,vec2(2.1,.8))+time*1.8)+.031*sin(dot(p,vec2(-1.3,2.7))-time*2.05);
    h+=.019*sin(dot(p,vec2(4.4,2.9))+time*2.8)+.010*sin(dot(p,vec2(-5.6,4.9))-time*3.2);
    for(int i=0;i<6;i++){
     float age=time-pulses[i].z;
     float r=length(p-pulses[i].xy);
     float band=r-age*1.9;
     if(age>=0.&&age<3.7)h+=.058*sin(22.*band)*exp(-4.8*band*band)*exp(-age*.68)*smoothstep(0.,.27,r);
    }
    return h;
   }
   void main(){
    vec2 p=world.xz;float e=.035;float h=wave(p);
    vec3 n=normalize(vec3(h-wave(p+vec2(e,0.)),e,h-wave(p+vec2(0.,e))));
    vec3 v=normalize(cameraPosition-world);
    float grazing=pow(1.-max(0.,dot(v,n)),3.);
    vec3 ref=reflect(-v,n);
    float reflection=max(0.,dot(ref,sun));
    float spark=pow(reflection,165.);
    float shimmer=pow(reflection,27.);
    float shallow=.5+.5*sin(p.x*.17+p.y*.11);
    vec3 water=mix(vec3(.024,.19,.18),vec3(.046,.34,.26),shallow);
    water=mix(water,vec3(.26,.43,.37),grazing*.66);
    water+=vec3(1.0,.51,.19)*shimmer*.40+vec3(2.7,1.84,.77)*spark;
    water=mix(water,vec3(.54,.47,.34),smoothstep(25.,75.,length(world-cameraPosition))*.68);
    gl_FragColor=vec4(water,1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
   }`
 });
 const waterGeometry=new T.PlaneGeometry(160,160,170,170);
 waterGeometry.rotateX(-Math.PI/2);
 scene.add(new T.Mesh(waterGeometry,waves));
 scene.add(new T.HemisphereLight(0xffe1b5,0x4c8d7c,2.1));
 const key=new T.DirectionalLight(0xffc68c,2.3);key.position.copy(sunDirection).multiplyScalar(12);scene.add(key);
 const wood=[0x80543b,0x997050,0x704b37,0xa27854].map(color=>new T.MeshStandardMaterial({color,roughness:.94}));
 const stone=new T.MeshStandardMaterial({color:0x667977,roughness:.96,flatShading:true});
 const reed=new T.MeshStandardMaterial({color:0x57683b,roughness:1});
 const reedTip=new T.MeshStandardMaterial({color:0x7a593c,roughness:1});
 function grainMap(kind,seed){
  const canvas=document.createElement('canvas');
  canvas.width=canvas.height=256;
  const ctx=canvas.getContext('2d'),image=ctx.createImageData(256,256);
  function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}
  for(let y=0;y<256;y++)for(let x=0;x<256;x++){
   const noise=random()-.5;
   const wave=Math.sin(y*.39+2.1*Math.sin(x*.028)+.73*Math.sin(x*.086));
   let shade;
   if(kind==='wood')shade=219+24*wave+23*noise-22*Math.pow(.5+.5*Math.sin(y*.96+x*.014),8);
   else if(kind==='stone')shade=215+48*noise+14*Math.sin(x*.13+y*.14)*Math.sin(y*.19-x*.08);
   else if(kind==='reed')shade=227+16*Math.sin(x*.46)+15*noise;
   else shade=209+49*noise+14*Math.sin(x*.49+y*.19);
   const i=(y*256+x)*4;
   image.data[i]=image.data[i+1]=image.data[i+2]=shade;image.data[i+3]=255;
  }
  ctx.putImageData(image,0,0);
  const texture=new T.CanvasTexture(canvas);
  texture.wrapS=texture.wrapT=T.RepeatWrapping;
  texture.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),8);
  return texture;
 }
 function surface(materials,kind,seed,depth){
  const bump=grainMap(kind,seed);
  const color=bump.clone();color.colorSpace=T.SRGBColorSpace;color.needsUpdate=true;
  for(const material of materials){material.map=color;material.bumpMap=bump;material.bumpScale=depth;}
 }
 surface(wood,'wood',418,.029);
 surface([stone],'stone',881,.028);
 surface([reed],'reed',243,.002);
 surface([reedTip],'seed head',627,.004);
 function box(p,dimensions,material){
  const o=new T.Mesh(new T.BoxGeometry(...dimensions),material);o.position.set(...p);scene.add(o);return o;
 }
 function rod(a,b,r,material){
  const p=new T.Vector3(...a),q=new T.Vector3(...b),d=q.clone().sub(p);
  const o=new T.Mesh(new T.CylinderGeometry(r*.72,r,d.length(),7),material);
  o.position.copy(p.add(q).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());scene.add(o);
 }
 for(let i=0;i<14;i++){
  const plank=box([-3.65,.25,4.8-i*.36],[1.94,.13,.332],wood[i%4]);plank.rotation.y=.018*Math.sin(i*2.21);
 }
 for(const x of [-4.46,-2.85]){
  box([x,.10,2.46],[.13,.15,5.05],wood[2]);
  for(const z of [.14,2.48,4.77])rod([x,-.62,z],[x,.46,z],.105,wood[2]);
 }
 const rock=new T.IcosahedronGeometry(1,1);
 for(let i=0;i<11;i++){
  const a=i*2.39996;
  const o=new T.Mesh(rock,stone);o.position.set(-5.25+Math.cos(a)*(.7+i*.05),-.13,4.63+Math.sin(a)*.96);
  o.scale.set(.27+i%3*.14,.23+i%4*.06,.31+i%5*.04);o.rotation.y=a;scene.add(o);
 }
 for(let i=0;i<42;i++){
  const a=i*2.39996;const cluster=i%3;
  const x=[-5.95,-4.8,-6.36][cluster]+Math.sin(a)*.41;
  const z=[3.94,5.35,5.48][cluster]+Math.cos(a)*.39;
  const h=.35+(i%11)*.054;
  const end=[x+.11*Math.cos(a),h,z+.14*Math.sin(a)];
  rod([x,-.09,z],end,.010,reed);
  if(i%3===0)rod(end,[end[0]+.023,h+.115,end[2]],.022,reedTip);
 }
 const ray=new T.Raycaster(),pointer=new T.Vector2(),hit=new T.Vector3();
 const waterPlane=new T.Plane(new T.Vector3(0,1,0),0);
 let start=null,next=0;
 renderer.domElement.addEventListener('pointerdown',e=>{if(e.isPrimary)start=[e.clientX,e.clientY];});
 renderer.domElement.addEventListener('pointercancel',()=>start=null);
 renderer.domElement.addEventListener('pointerup',e=>{
  if(!e.isPrimary||!start)return;
  const moved=Math.hypot(e.clientX-start[0],e.clientY-start[1]);start=null;
  if(moved>6)return;
  const r=renderer.domElement.getBoundingClientRect();
  pointer.set((e.clientX-r.left)/r.width*2-1,1-(e.clientY-r.top)/r.height*2);
  ray.setFromCamera(pointer,camera);
  if(ray.ray.intersectPlane(waterPlane,hit)&&hit.length()<75){
   pulses[next].set(hit.x,hit.z,time.value,0);next=(next+1)%pulses.length;
  }
 });
 function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
 addEventListener('resize',resize);
 hint.textContent='拖曳看水光 · 雙指或滾輪縮放 · 輕點水面激起漣漪';
 renderer.setAnimationLoop(ms=>{time.value=ms*.001;renderer.render(scene,camera);});
}catch(error){hint.textContent='水面載入失敗，請確認連線後重新整理。';console.error(error);}
</script></html>
