<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Susurrus｜場景色票</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4e7;color:#392f26;font-family:system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:32px 22px 64px}header{border-bottom:1px solid #c7bdab;margin-bottom:28px}h1{font-size:clamp(30px,5vw,49px);margin:.15em 0}p{line-height:1.6;color:#5f5244}h2{margin:0;font-size:20px}section{margin:25px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:8px}button{display:block;width:100%;border:1px solid #c7bdab;border-radius:7px;background:#fffaf0;color:inherit;padding:0;text-align:left;overflow:hidden;cursor:pointer;font:inherit}.chip{display:block;height:59px;background:var(--swatch);border-bottom:1px solid #0002}.name,code{display:block;margin:5px 8px}code{font-size:13px}a{color:#326b5d}.notice{position:fixed;bottom:12px;right:12px;padding:8px 12px;background:#493a2b;color:#fff;min-height:1em;border-radius:6px}.notice:empty{display:none}</style><main><header><small>失物宇宙 · 場景配色參考</small><h1>Susurrus 場景色票</h1><p>35 個 sRGB 代表色，涵蓋紙本開場、水面遠景與小島近景。依畫面目測歸納，包含光照、霧和反射的效果。點色塊可複製 HEX。</p><p><a href="https://susurrus.vercel.app/">原始場景 · Susurrus / Xianyao Wei</a></p></header><section><h2>紙張與介面</h2><p>故事卡、字體、邊框</p><div class="grid"><button type="button" data-hex="#FBF9E9" aria-label="複製象牙紙 #FBF9E9"><span class="chip" style="--swatch:#FBF9E9"></span><span class="name">象牙紙</span><code>#FBF9E9</code></button><button type="button" data-hex="#EEE8D4" aria-label="複製紙面暖影 #EEE8D4"><span class="chip" style="--swatch:#EEE8D4"></span><span class="name">紙面暖影</span><code>#EEE8D4</code></button><button type="button" data-hex="#C7BDAB" aria-label="複製紙邊灰褐 #C7BDAB"><span class="chip" style="--swatch:#C7BDAB"></span><span class="name">紙邊灰褐</span><code>#C7BDAB</code></button><button type="button" data-hex="#86735E" aria-label="複製鉛筆褐 #86735E"><span class="chip" style="--swatch:#86735E"></span><span class="name">鉛筆褐</span><code>#86735E</code></button><button type="button" data-hex="#493A2B" aria-label="複製深墨褐 #493A2B"><span class="chip" style="--swatch:#493A2B"></span><span class="name">深墨褐</span><code>#493A2B</code></button></div></section><section><h2>天空與暮光</h2><p>背景漸層、霧、主光</p><div class="grid"><button type="button" data-hex="#C9F8EC" aria-label="複製薄荷天光 #C9F8EC"><span class="chip" style="--swatch:#C9F8EC"></span><span class="name">薄荷天光</span><code>#C9F8EC</code></button><button type="button" data-hex="#D9EDE0" aria-label="複製青白霧 #D9EDE0"><span class="chip" style="--swatch:#D9EDE0"></span><span class="name">青白霧</span><code>#D9EDE0</code></button><button type="button" data-hex="#F5EBD0" aria-label="複製奶油雲 #F5EBD0"><span class="chip" style="--swatch:#F5EBD0"></span><span class="name">奶油雲</span><code>#F5EBD0</code></button><button type="button" data-hex="#F7D4A5" aria-label="複製淡杏天空 #F7D4A5"><span class="chip" style="--swatch:#F7D4A5"></span><span class="name">淡杏天空</span><code>#F7D4A5</code></button><button type="button" data-hex="#FAB675" aria-label="複製蜜橘地平線 #FAB675"><span class="chip" style="--swatch:#FAB675"></span><span class="name">蜜橘地平線</span><code>#FAB675</code></button><button type="button" data-hex="#CBAC86" aria-label="複製暖霧山影 #CBAC86"><span class="chip" style="--swatch:#CBAC86"></span><span class="name">暖霧山影</span><code>#CBAC86</code></button></div></section><section><h2>水面與倒影</h2><p>水面底色、反光、倒影</p><div class="grid"><button type="button" data-hex="#92F4D2" aria-label="複製淺水亮青 #92F4D2"><span class="chip" style="--swatch:#92F4D2"></span><span class="name">淺水亮青</span><code>#92F4D2</code></button><button type="button" data-hex="#72E6BD" aria-label="複製碧綠水面 #72E6BD"><span class="chip" style="--swatch:#72E6BD"></span><span class="name">碧綠水面</span><code>#72E6BD</code></button><button type="button" data-hex="#6BCFA8" aria-label="複製水波青綠 #6BCFA8"><span class="chip" style="--swatch:#6BCFA8"></span><span class="name">水波青綠</span><code>#6BCFA8</code></button><button type="button" data-hex="#9AB78F" aria-label="複製遠水灰綠 #9AB78F"><span class="chip" style="--swatch:#9AB78F"></span><span class="name">遠水灰綠</span><code>#9AB78F</code></button><button type="button" data-hex="#478F76" aria-label="複製倒影深綠 #478F76"><span class="chip" style="--swatch:#478F76"></span><span class="name">倒影深綠</span><code>#478F76</code></button></div></section><section><h2>草地與樹木</h2><p>草皮、葉冠、花與枯草</p><div class="grid"><button type="button" data-hex="#75B95A" aria-label="複製草地亮綠 #75B95A"><span class="chip" style="--swatch:#75B95A"></span><span class="name">草地亮綠</span><code>#75B95A</code></button><button type="button" data-hex="#5BA45C" aria-label="複製草地中綠 #5BA45C"><span class="chip" style="--swatch:#5BA45C"></span><span class="name">草地中綠</span><code>#5BA45C</code></button><button type="button" data-hex="#849D55" aria-label="複製苔蘚橄欖 #849D55"><span class="chip" style="--swatch:#849D55"></span><span class="name">苔蘚橄欖</span><code>#849D55</code></button><button type="button" data-hex="#4C987B" aria-label="複製樹冠藍綠 #4C987B"><span class="chip" style="--swatch:#4C987B"></span><span class="name">樹冠藍綠</span><code>#4C987B</code></button><button type="button" data-hex="#326B5D" aria-label="複製葉下深青 #326B5D"><span class="chip" style="--swatch:#326B5D"></span><span class="name">葉下深青</span><code>#326B5D</code></button><button type="button" data-hex="#E3BC67" aria-label="複製花穗金黃 #E3BC67"><span class="chip" style="--swatch:#E3BC67"></span><span class="name">花穗金黃</span><code>#E3BC67</code></button></div></section><section><h2>岩石與地表</h2><p>岩面亮暗、遠處岩壁</p><div class="grid"><button type="button" data-hex="#8D9C92" aria-label="複製岩石亮灰 #8D9C92"><span class="chip" style="--swatch:#8D9C92"></span><span class="name">岩石亮灰</span><code>#8D9C92</code></button><button type="button" data-hex="#6D8282" aria-label="複製冷灰岩面 #6D8282"><span class="chip" style="--swatch:#6D8282"></span><span class="name">冷灰岩面</span><code>#6D8282</code></button><button type="button" data-hex="#53686D" aria-label="複製藍灰岩石 #53686D"><span class="chip" style="--swatch:#53686D"></span><span class="name">藍灰岩石</span><code>#53686D</code></button><button type="button" data-hex="#42575D" aria-label="複製深岩裂縫 #42575D"><span class="chip" style="--swatch:#42575D"></span><span class="name">深岩裂縫</span><code>#42575D</code></button><button type="button" data-hex="#AC906C" aria-label="複製遠岩赭灰 #AC906C"><span class="chip" style="--swatch:#AC906C"></span><span class="name">遠岩赭灰</span><code>#AC906C</code></button></div></section><section><h2>建築、木材與船</h2><p>牆、屋瓦、木梁、船身與窗框</p><div class="grid"><button type="button" data-hex="#FFF3D7" aria-label="複製暖白灰泥 #FFF3D7"><span class="chip" style="--swatch:#FFF3D7"></span><span class="name">暖白灰泥</span><code>#FFF3D7</code></button><button type="button" data-hex="#E2C5A5" aria-label="複製牆面暖影 #E2C5A5"><span class="chip" style="--swatch:#E2C5A5"></span><span class="name">牆面暖影</span><code>#E2C5A5</code></button><button type="button" data-hex="#F78543" aria-label="複製亮橙屋瓦 #F78543"><span class="chip" style="--swatch:#F78543"></span><span class="name">亮橙屋瓦</span><code>#F78543</code></button><button type="button" data-hex="#E85A39" aria-label="複製珊瑚紅瓦 #E85A39"><span class="chip" style="--swatch:#E85A39"></span><span class="name">珊瑚紅瓦</span><code>#E85A39</code></button><button type="button" data-hex="#B94C34" aria-label="複製磚紅背光 #B94C34"><span class="chip" style="--swatch:#B94C34"></span><span class="name">磚紅背光</span><code>#B94C34</code></button><button type="button" data-hex="#A66E4F" aria-label="複製暖木梁 #A66E4F"><span class="chip" style="--swatch:#A66E4F"></span><span class="name">暖木梁</span><code>#A66E4F</code></button><button type="button" data-hex="#754536" aria-label="複製深栗木船 #754536"><span class="chip" style="--swatch:#754536"></span><span class="name">深栗木船</span><code>#754536</code></button><button type="button" data-hex="#60898B" aria-label="複製窗框藍綠 #60898B"><span class="chip" style="--swatch:#60898B"></span><span class="name">窗框藍綠</span><code>#60898B</code></button></div></section><p>做模型時可先用草地中綠、藍灰岩石、暖白灰泥與暖木梁當材質起點。薄荷天光、淡杏天空和水面亮青更適合作為環境色參考。</p></main><div class="notice" role="status"></div><script>
let timer;
document.querySelector('main').addEventListener('click',async event=>{
 const button=event.target.closest('[data-hex]');
 if(!button)return;
 const hex=button.dataset.hex,status=document.querySelector('[role=status]');
 try{await navigator.clipboard.writeText(hex);status.textContent='已複製 '+hex;}
 catch{const selection=window.getSelection(),range=document.createRange();range.selectNodeContents(button.querySelector('code'));selection.removeAllRanges();selection.addRange(range);status.textContent='已選取 '+hex+'，按 Ctrl+C 複製';}
 clearTimeout(timer);timer=setTimeout(()=>status.textContent='',3300);
});
</script></html>
