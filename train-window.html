<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/loaders/GLTFLoader.js';
import {RoundedBoxGeometry} from 'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/geometries/RoundedBoxGeometry.js';

const scene=new T.Scene();
const camera=new T.PerspectiveCamera(39,1,.1,80);
camera.position.set(6.5,4.3,10);
const renderer=new T.WebGLRenderer({alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
function createDragControls(camera, canvas, target, minDistance, maxDistance){
 const controls={enabled:true,wasGesture:false};
 const fingers=new Map();
 const startOffset=new T.Vector3(),startOrientation=new T.Quaternion();
 const horizontal=new T.Quaternion(),vertical=new T.Quaternion(),rotation=new T.Quaternion(),twist=new T.Quaternion();
 const right=new T.Vector3(1,0,0),up=new T.Vector3(0,1,0),forwardAxis=new T.Vector3(0,0,1);
 const offset=new T.Vector3();
 let startX=0,startY=0,startGap=0,startDistance=0,startAngle=0;
 camera.lookAt(target);
 function gap(){
  const [a,b]=fingers.values();
  return Math.hypot(a.x-b.x,a.y-b.y);
 }

  const [first]=fingers.values();
  if(!first)return;
  startX=first.x;startY=first.y;
  startOffset.copy(camera.position).sub(target);
  startOrientation.copy(camera.quaternion);
  startDistance=startOffset.length();
  startGap=fingers.size===2?gap():0; if(startGap){const [a,b]=fingers.values();startAngle=Math.atan2(b.y-a.y,b.x-a.x);}
 }
 function zoom(distance){
  offset.copy(camera.position).sub(target).setLength(T.MathUtils.clamp(distance,minDistance,maxDistance));
  camera.position.copy(target).add(offset);
 }
 canvas.addEventListener('pointerdown',event=>{
  if(!controls.enabled||(event.pointerType==='mouse'&&event.button!==0)||fingers.size>=2)return;
  if(!fingers.size)controls.wasGesture=false;
  fingers.set(event.pointerId,{x:event.clientX,y:event.clientY});
  if(fingers.size===2)controls.wasGesture=true;
  canvas.setPointerCapture(event.pointerId);
  resetGesture();
 });
 canvas.addEventListener('pointermove',event=>{
  const point=fingers.get(event.pointerId);
  if(!point||!controls.enabled)return;
  point.x=event.clientX;point.y=event.clientY;
  if(fingers.size===2){
   if(startGap>0){
    const [a,b]=fingers.values();
    const change=Math.atan2(b.y-a.y,b.x-a.x)-startAngle;
    const angle=Math.atan2(Math.sin(change),Math.cos(change));
    twist.setFromAxisAngle(forwardAxis,angle);
    camera.quaternion.copy(startOrientation).multiply(twist);
    zoom(startDistance*startGap/Math.max(8,gap()));
   }
   return;
  }
  const dx=point.x-startX,dy=point.y-startY;
  if(!controls.wasGesture&&Math.hypot(dx,dy)<6)return;
  controls.wasGesture=true;
  const speed=Math.PI/Math.max(240,Math.min(canvas.clientWidth,canvas.clientHeight));
  horizontal.setFromAxisAngle(up,-dx*speed);
  vertical.setFromAxisAngle(right,-dy*speed);
  rotation.copy(startOrientation).multiply(horizontal).multiply(vertical);
  camera.quaternion.copy(rotation);
  rotation.multiply(startOrientation.clone().invert());
  camera.position.copy(startOffset).applyQuaternion(rotation).add(target);
 });
 function release(event){

   grave.add(puff);
   incenseSmoke.push({puff,z,phase:phase+j/7});
  }
 }else if(kind===1){
  mesh(new T.CylinderGeometry(.124,.095,.022,22),incenseClay,0,.021,z,grave);
  for(const [x,dz,r] of [[-.048,-.018,.044],[.044,-.026,.049],[.006,.047,.040]]){
   mesh(new T.SphereGeometry(r,14,10),orange,x,.031+r*.91,z+dz,grave);
   mesh(new T.SphereGeometry(.008,8,6),flowerLeaf,x,.031+r*1.86,z+dz,grave);
  }
 }else{
  box(.15,.022,.22,0,.019,z,linen,.014,grave);
  for(const [x,dz] of [[-.047,-.058],[.018,-.088],[.061,-.047]]){
   const stem=box(.009,.009,.16,x*.64,.036,z+dz+.063,flowerLeaf,.004,grave);
   stem.rotation.y=x*5;
   for(let j=0;j<5;j++){
    const angle=j*Math.PI*2/5;
    mesh(new T.SphereGeometry(.016,8,6),flowerPetal,x+Math.cos(angle)*.018,.046,z+dz+Math.sin(angle)*.018,grave);
   }
   mesh(new T.SphereGeometry(.011,8,6),linen,x,.055,z+dz,grave);
  }
 }
}
const cemeteryModels=JSON.parse(document.querySelector('#cemetery-models').textContent);
const cemeteryLoader=new GLTFLoader();
const cemeteryKeepsakes=[
 {
  model:'comb',title:'舊梳子',size:.29,x:.50,z:.55,
  poem:['以前我嫌你梳得太慢，','每次都把梳子搶過來。','','今天風把頭髮吹到臉上。','我站在你碑前，','第一次等了那麼久。']
 },
 {
  model:'envelope',title:'沒寄出的信封',size:.27,x:-.55,z:.60,
  poem:['我把信念得很慢，','像在電話裡等你插話。','','念到最後一行，','我還是留了一點空白，','等你說，嗯，我在聽。']
 },
 {
  model:'harmonica',title:'走調的口琴',size:.30,x:.51,z:.49,
  poem:['來的路上，我還在想，','那天究竟是誰先掛了電話。','','在你碑前，我把你教的曲子吹完。','有一個音走了調，','這次我讓它就這樣過去。']
 }
];
function addCemeteryKeepsake(ground,index){
 const {model,title,poem,size,x,z}=cemeteryKeepsakes[index];
 const item=keepsake(title,poem.join('\n'),x,.179,z,ground);
 item.userData.inCemetery=true;
 item.rotation.y=[-.36,.31,-.28][index];
 const raw=atob(cemeteryModels[model]);
 const bytes=Uint8Array.from(raw,char=>char.charCodeAt(0));
 cemeteryLoader.parse(bytes.buffer,'',gltf=>{
  const modelScene=gltf.scene;
  const bounds=new T.Box3().setFromObject(modelScene);
  const extent=bounds.getSize(new T.Vector3());
  const scale=size/Math.max(extent.x,extent.y,extent.z);
  const center=bounds.getCenter(new T.Vector3());
  const holder=new T.Group();
  holder.scale.setScalar(scale);
  holder.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);
  holder.add(modelScene);
  item.add(holder);
 },error=>console.error('無法載入墓地失物',model,error));
}
const undersideTiles=[];
for(let i=0;i<3;i++){
 const tile=new T.Group();
 tile.position.set((i-1)*2,-.235,0);
 scene.add(tile);
 undersideTiles.push(tile);
 box(1.97,.22,3.56,0,0,0,baseMetal,.035,tile);
 for(const z of [-1.54,1.54])box(1.89,.037,.065,0,-.112,z,metal,.012,tile);

 const graveyard=new T.Group();
 tile.add(graveyard);
 tile.userData.graveyard=graveyard;
 addCemeteryKeepsake(graveyard,i);
 box(1.97,.066,3.56,0,.138,0,earth,.021,graveyard);
 const pathCenter=x=>.25*Math.sin(((i-1)*2+x)*1.6)+.09*Math.sin(((i-1)*2+x)*4);
 const shard=new T.DodecahedronGeometry(1,0);
 for(let j=0;j<36;j++){
  const x=(gardenRandom()-.5)*1.82;
  const z=pathCenter(x)+(gardenRandom()-.5)*.60;
  const pebble=mesh(shard,j%5===0?stone:gravel,x,.174+gardenRandom()*.018,z,graveyard);
  const size=.035+Math.pow(gardenRandom(),2)*.13;
  pebble.scale.set(size,.012+gardenRandom()*.022,size*(.65+gardenRandom()*.72));
  pebble.rotation.y=gardenRandom()*Math.PI;
 }
 const heights=[[.39,.68,.28],[.76,.30,.53],[.45,.23,.86]][i];
 for(const [index,[x,z]] of [[-.54,-.92],[.43,-1.19],[-.12,1.06]].entries()){
  const h=heights[index];
  const width=.22+h*.28;
  const grave=new T.Group();
  grave.position.set(x,.166,z);
  grave.rotation.set((gardenRandom()-.5)*.24,(gardenRandom()-.5)*.68,(gardenRandom()-.5)*.28);
  graveyard.add(grave);
  placeOffering(grave,(i+index)%3,i*.17);
  box(width+.16,.092,.37,0,.038,0,stone,.025,grave);
  const slab=rounded(width,h,Math.min(.09,h*.23));
  mesh(new T.ExtrudeGeometry(slab,{depth:.103,bevelThickness:.012,bevelSize:.013,bevelSegments:2}),stone,0,h/2+.06,-.052,grave);
  for(let line=0;line<2;line++)box(width*(.48-line*.10),.009,.005,0,h*.67-line*.038,.054,gravel,.002,grave);
  for(let j=0;j<6;j++){
   const patch=mesh(shard,moss,(gardenRandom()-.5)*width*.84,.12+gardenRandom()*h*.36,.052,grave);
   patch.scale.set(.017+gardenRandom()*.041,.013+gardenRandom()*.031,.009);
  }
 }
 const bladePositions=[],bladeColors=[];
 for(let j=0;j<175;j++){
  const thicket=j>=109;
  const patchSign=j%2===0?1:-1;
  const x=thicket?patchSign*.66+(gardenRandom()-.5)*.46:(gardenRandom()-.5)*1.87;
  const z=thicket?patchSign*(1.20+(gardenRandom()-.5)*.72):(gardenRandom()-.5)*3.39;
  const onPath=Math.abs(z-pathCenter(x))<.27;
  if(onPath&&gardenRandom()<.57)continue;
  const height=(onPath?.53:thicket?1.85:1)*(.09+gardenRandom()*.22);
  for(let k=0;k<7;k++){
   const angle=gardenRandom()*Math.PI*2;
   const width=.008+gardenRandom()*.014;
   const dx=Math.cos(angle),dz=Math.sin(angle);
   const bx=x+(gardenRandom()-.5)*.106,bz=z+(gardenRandom()-.5)*.106;
   const bend=.024+gardenRandom()*.093;
   bladePositions.push(bx-dx*width,.17,bz-dz*width,bx+dx*width,.17,bz+dz*width,
    bx-dz*bend,.17+height*(.51+gardenRandom()*.70),bz+dx*bend);
   const tip=new T.Color().setHSL(.12+gardenRandom()*.13,.22+gardenRandom()*.30,.24+gardenRandom()*.23);
   bladeColors.push(tip.r*.49,tip.g*.49,tip.b*.49,tip.r*.58,tip.g*.58,tip.b*.58,tip.r,tip.g,tip.b);
  }
 }
 const foliage=new T.BufferGeometry();
 foliage.setAttribute('position',new T.Float32BufferAttribute(bladePositions,3));
 foliage.setAttribute('color',new T.Float32BufferAttribute(bladeColors,3));
 foliage.computeVertexNormals();
 mesh(foliage,grassBlades,0,0,0,graveyard);
}
const undersideFill=new T.DirectionalLight(0xb9c5df,0);
undersideFill.position.set(2,-6,4);
scene.add(undersideFill);
const rainDrops=Array.from({length:190},()=>({
 x:(gardenRandom()-.5)*5.75,
 z:(gardenRandom()-.5)*3.35,
 phase:gardenRandom(),
 speed:.64+gardenRandom()*.57,
 length:.065+gardenRandom()*.15
}));
const rainPositions=new Float32Array(rainDrops.length*6);
const rainGeometry=new T.BufferGeometry();
rainGeometry.setAttribute('position',new T.BufferAttribute(rainPositions,3).setUsage(T.DynamicDrawUsage));
const rainMaterial=new T.LineBasicMaterial({color:0xc1d3df,transparent:true,opacity:0,depthWrite:false});
const cemeteryRain=new T.LineSegments(rainGeometry,rainMaterial);
cemeteryRain.position.y=-.40;
cemeteryRain.rotation.x=Math.PI;
cemeteryRain.frustumCulled=false;
cemeteryRain.visible=false;
scene.add(cemeteryRain);
function updateCemeteryRain(ms,progress){
 const opacity=.42*T.MathUtils.smoothstep(progress,.74,.98);
 cemeteryRain.visible=opacity>.005;
 if(!cemeteryRain.visible)return;
 rainMaterial.opacity=opacity;
 for(let i=0;i<rainDrops.length;i++){
  const {x,z,phase,speed,length}=rainDrops[i];
  const y=(1-(phase+ms*.001*speed)%1)*1.38;
  const drift=y*.16;
  const offset=i*6;
  rainPositions[offset]=x+drift;
  rainPositions[offset+1]=y;
  rainPositions[offset+2]=z;
  rainPositions[offset+3]=x+drift+length*.16;
  rainPositions[offset+4]=y+length;
  rainPositions[offset+5]=z;
 }
 rainGeometry.attributes.position.needsUpdate=true;
}
let undersideOpen=false;
let undersideProgress=0;
let previousFrame=0;
function updateUnderside(ms){
 const distance=Math.hypot(camera.position.x,camera.position.y-1.48,camera.position.z+.38);
 const downward=(1.48-camera.position.y)/distance;
 // Keep the cemetery open throughout the underside view.
 if(downward>.70)undersideOpen=true;
 if(downward<0)undersideOpen=false;
 const elapsed=Math.min(50,ms-previousFrame);
 previousFrame=ms;
 undersideProgress=T.MathUtils.damp(undersideProgress,undersideOpen?1:0,4.2,elapsed/1000);
 undersideFill.intensity=undersideProgress*1.25;
 updateCemeteryRain(ms,undersideProgress);
 if(undersideProgress>.42){
  for(const {puff,z,phase} of incenseSmoke){
   const age=(ms/3900+phase)%1;
   const drift=Math.sin(age*6+phase*5)*age;
   puff.position.set(drift*.077,.20+age*.44,z+age*.075);
   puff.scale.setScalar(.042+age*.155);
   puff.material.opacity=Math.sin(age*Math.PI)*.58;
  }
 }
 undersideTiles.forEach((tile,index)=>{
  const turn=T.MathUtils.smoothstep(undersideProgress,index*.10,.90+index*.045);
  tile.rotation.z=Math.PI*turn;
  tile.userData.graveyard.visible=turn>.48;
 });
}
function resize(){
 renderer.setSize(innerWidth,innerHeight);
 camera.aspect=innerWidth/innerHeight;
 camera.fov=camera.aspect<1?62:39;
 camera.updateProjectionMatrix();
}
addEventListener('resize',resize);
resize();
let last=-Infinity;
renderer.setAnimationLoop(ms=>{
 if(ms-last>=32){drawWindow(ms/1000);last=ms;}
 updateUnderside(ms);
 renderer.render(scene,camera);
});
</script>
