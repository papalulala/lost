   const y=T.MathUtils.lerp(12*grassHeight(edge/12,direction*.495)+4.32+.144,-.665,fade);
   positions.push(edge,y,z);
  }
  if(i>0){const j=i*2;indices.push(j-2,j-1,j,j,j-1,j+1);}
 }
 const geometry=new T.BufferGeometry();
 geometry.setAttribute('position',new T.Float32BufferAttribute(positions,3));
 geometry.setIndex(indices);
 geometry.computeVertexNormals();
 forest.add(new T.Mesh(geometry,distantRoad));
}
const trunks=new T.InstancedMesh(trunkShape,bark,310);
const roundedCrown=clusteredCrown;
const broadleaf=new T.InstancedMesh(roundedCrown,new T.MeshStandardMaterial({roughness:.94}),310);
const conifers=new T.InstancedMesh(crownShape,new T.MeshStandardMaterial({roughness:.93}),930);
const treePose=new T.Object3D();
const canopyColor=new T.Color();
let treeCount=0,leafCount=0,coneCount=0;
for(let i=0;i<310;i++){
 const angle=i*2.39996;
 const radius=5.5+16*Math.sqrt((i+.5)/310);
 const x=Math.sin(angle)*radius,z=Math.cos(angle)*radius;
 const route=forestRoadX(z)+1.3*T.MathUtils.smoothstep(Math.abs(z),5.94,8.34)*Math.sin((z-Math.sign(z)*5.94)*.47);
 if((radius<6.25&&Math.abs(z)<5.94)||(Math.abs(x-route)<1.50&&Math.abs(z)>5.3&&Math.abs(z)<18))continue;
 const h=1.65+random()*3.9;
 treePose.position.set(x,-.68+h*.22,z);
 treePose.scale.set(h*.042,h*.44,h*.042);
 treePose.rotation.set(0,0,0);
 treePose.updateMatrix();
 trunks.setMatrixAt(treeCount++,treePose.matrix);
 canopyColor.setHSL(.23+random()*.14,.31+random()*.22,.20+random()*.19);
 if(i%3===0){
  treePose.position.set(x,-.68+h*.70,z);
  treePose.scale.set(h*.31,h*.38,h*.30);
  treePose.rotation.y=angle;
  treePose.updateMatrix();
  broadleaf.setMatrixAt(leafCount,treePose.matrix);
  broadleaf.setColorAt(leafCount++,canopyColor);
 }else{
  for(let layer=0;layer<3;layer++){
   const width=h*(.27-layer*.055);
   treePose.position.set(x,-.68+h*(.48+layer*.16),z);
   treePose.scale.set(width,h*.55,width*.92);
   treePose.rotation.y=angle+layer;
   treePose.updateMatrix();
   conifers.setMatrixAt(coneCount,treePose.matrix);
   conifers.setColorAt(coneCount++,canopyColor);
  }
 }
}
trunks.count=treeCount;
broadleaf.count=leafCount;
conifers.count=coneCount;
forest.add(trunks,broadleaf,conifers);
const treeFlights=[trunks,broadleaf,conifers].map(mesh=>{
 mesh.frustumCulled=false;
 const homes=Array.from({length:mesh.count},(_,i)=>{
  const matrix=new T.Matrix4();
  mesh.getMatrixAt(i,matrix);
  return matrix;
 });
 return {mesh,homes};
});
const miniatureHomes=miniatureTrees.map(tree=>tree.position.clone());
const flyingMatrix=new T.Matrix4();
const burstGroup=new T.Group();
crystal.add(burstGroup);
burstGroup.visible=false;
const flyingTrees=miniatureTrees.map(source=>{
 const tree=source.clone();
 burstGroup.add(tree);
 return tree;
});
let plantingStart=null;
function treeProgress(age,x,z){
 const distance=Math.hypot(x,z);
 const spread=.48+.52*Math.sin(x*3.33+z*2.17);
 return T.MathUtils.clamp((age-.62-distance*.039-spread*.79)/(.81+distance*.013),0,1);
}
function fallRemaining(progress){
 return 1-progress*progress;
}
function plantForest(now){
 if(plantingStart===null)return;
 const age=(now-plantingStart)/1000;
 const done=age>=3.6;
 for(const {mesh,homes} of treeFlights){
  homes.forEach((home,i)=>{
   const x=home.elements[12],y=home.elements[13],z=home.elements[14];
   const t=done?1:treeProgress(age,x,z);
   const remaining=fallRemaining(t);
   flyingMatrix.copy(home);
   if(t===0){
    for(let k=0;k<12;k++)flyingMatrix.elements[k]=0;
   }
   flyingMatrix.setPosition(x-3.7*remaining,y+15*remaining,z+2.1*remaining);
   mesh.setMatrixAt(i,flyingMatrix);
  });
  mesh.instanceMatrix.needsUpdate=true;
 }
 miniatureTrees.forEach((tree,i)=>{
  const home=miniatureHomes[i];
  const t=done?1:treeProgress(age,home.x*12,home.z*12);
  const remaining=fallRemaining(t);
  tree.visible=t>0;
  tree.position.set(home.x-3.7*remaining/12,home.y+15*remaining/12,home.z+2.1*remaining/12);
 });
 if(done){
  plantingStart=null;
  forestToggle.disabled=false;
 }
}
function burstFromCrystal(progress){
 burstGroup.visible=progress>0&&progress<1;
 flyingTrees.forEach((tree,i)=>{
  const home=miniatureHomes[i];
  const delay=.035+.54*i/Math.max(1,flyingTrees.length-1);
  const t=T.MathUtils.clamp((progress-delay)/.38,0,1);
  miniatureTrees[i].visible=progress<=delay;
  tree.visible=t>0&&t<1;
  if(!tree.visible)return;
  const angle=Math.atan2(home.z,home.x)+.21*Math.sin(i*2.4);
  const reach=t*t*(.81+(i%5)*.18);
  tree.position.set(home.x+Math.cos(angle)*reach,home.y+t*(1.24+(i%7)*.11),home.z+Math.sin(angle)*reach);
  tree.rotation.set(t*(1+i%3),angle*t*1.6,t*Math.sin(angle)*2);
  tree.scale.setScalar(1+.23*Math.sin(Math.PI*t));
 });
}
const sceneNavigation=document.querySelector('.scene-nav');
const forestToggle=document.querySelector('#forest-toggle');
const forestTransition=document.querySelector('.forest-transition');
const sceneHint=document.querySelector('footer');
const worldHint=sceneHint.textContent;
const ray=new T.Raycaster();
const pointer=new T.Vector2();
let forestActive=false,canEnter=false,transition=null;
function switchForest(enter,now){
 forestActive=enter;
 sceneNavigation.hidden=enter;
 worldControls.enabled=!enter;
 forestControls.enabled=enter;
 if(enter){
  forest.add(forestInterior);
  forestInterior.position.y=4.32;
  forestInterior.scale.setScalar(12);
  forestCamera.position.copy(forestViewStart);
  forestCamera.lookAt(forestTarget);
  if(!reduceMotion.matches){plantingStart=now;plantForest(now);}
 }else{
  crystal.add(forestInterior);
  forestInterior.position.set(0,0,0);
  forestInterior.scale.setScalar(1);
  burstGroup.visible=false;
  miniatureTrees.forEach((tree,i)=>{
   tree.visible=true;
   tree.position.copy(miniatureHomes[i]);
   tree.scale.setScalar(1);
  });
 }
 forestToggle.textContent=enter?'回到沙丘':'走進水晶球';
 sceneHint.textContent=enter?'拖曳環顧森林 · 滾輪或雙指縮放 · 點選失物讀故事':worldHint;
}
function requestForest(enter){
 if(transition||plantingStart!==null||(enter&&!canEnter))return;
 transition={enter,start:performance.now(),switched:false};
 forestToggle.disabled=true;
}
forestToggle.addEventListener('click',()=>requestForest(!forestActive));
addEventListener('keydown',event=>{
 if(event.key==='Escape'&&forestActive&&!storyDialog.open)requestForest(false);
});
renderer.domElement.addEventListener('pointerup',event=>{
 const controls=forestActive?forestControls:worldControls;
 if(transition||controls.wasGesture||event.button!==0)return;
 const bounds=renderer.domElement.getBoundingClientRect();
 pointer.set((event.clientX-bounds.left)/bounds.width*2-1,1-(event.clientY-bounds.top)/bounds.height*2);
 ray.setFromCamera(pointer,forestActive?forestCamera:camera);
 if(forestActive){
  const hit=ray.intersectObject(forestInterior,true).find(({object})=>{
   for(let node=object;node;node=node.parent)if(!node.visible)return false;
   return true;
  });
  for(let object=hit?.object;object&&object!==forestInterior;object=object.parent){
   if(object.userData.story){openDreamStory(object.userData.story);break;}
  }
 }else if(canEnter){
  const hit=ray.intersectObject(shell)[0];
  const sand=ray.intersectObject(underside)[0];
  if(hit&&(!sand||hit.distance<sand.distance))requestForest(true);
 }
});
function updateForestTransition(now){
 if(!transition)return;
 const duration=reduceMotion.matches?300:transition.enter?1930:850;
 const progress=T.MathUtils.clamp((now-transition.start)/duration,0,1);
 const cut=transition.enter&&!reduceMotion.matches?.67:.5;
 if(transition.enter&&!transition.switched&&!reduceMotion.matches)burstFromCrystal(Math.min(1,progress/cut));
 const flash=progress<cut
  ? T.MathUtils.smoothstep(progress,cut*.72,cut)
  : 1-T.MathUtils.smoothstep(progress,cut,1);
 forestTransition.style.opacity=flash*.92;
 if(progress>=cut&&!transition.switched){
  switchForest(transition.enter,now);
  transition.switched=true;
 }
 if(progress===1){
  transition=null;
  forestTransition.style.opacity=0;
  forestToggle.disabled=plantingStart!==null;
 }
}
function renderWorld(time){
 relativeCamera.copy(camera.position).sub(orbitTarget);
 const down=-relativeCamera.y/relativeCamera.length();
 const blend=T.MathUtils.smoothstep(down,-.08,.52);
 crystal.visible=blend>.15;
 canEnter=blend>.65;
 forestToggle.hidden=!canEnter;
 updateWind(time,blend);
 desertSky.style.opacity=blend;
 waterRays.style.opacity=1-blend;
 desertSun.intensity=3.25*blend;
 waterAmbient.intensity=1.45*(1-.81*blend);
 desertAmbient.intensity=.78*blend;
 sun.intensity=1.8*(1-blend);
 motes.material.opacity=.38*(1-blend);
 renderer.render(scene,camera);
}
function resize(){
 renderer.setSize(innerWidth,innerHeight);
 camera.aspect=innerWidth/innerHeight;
 camera.fov=camera.aspect<1?59:40;
 camera.updateProjectionMatrix();
 forestCamera.aspect=camera.aspect;
 forestCamera.updateProjectionMatrix();
}
addEventListener('resize',resize);
resize();
renderer.setAnimationLoop(ms=>{
 const time=ms*.001;
 waterTime.value=time;
 plants.forEach((patch,i)=>{
  patch.rotation.z=.1*Math.sin(time*1.15+i*.8);
  patch.rotation.x=.07*Math.cos(time*.9+i);
 });
 motes.rotation.y=time*.04;
 motes.position.y=.17*Math.sin(time*.42);
 updateForestTransition(ms);
 if(forestActive){
  plantForest(ms);
  renderer.render(forest,forestCamera);
 }
 else renderWorld(time);
});
</script>
